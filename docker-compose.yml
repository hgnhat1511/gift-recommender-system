services:
  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for local Compose}
      MYSQL_DATABASE: ${DB_NAME:-gift_ecommerce}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ML_HOST_PORT:-8000}:8000"
    environment:
      - PORT=8000
    volumes:
      - ./ml-service/models:/app/models:ro
      - ./ml-service/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis-cache:
        condition: service_healthy

  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      - ./database/migrations:/database/migrations:ro
    environment:
      - PORT=5000
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for local Compose}
      - DB_NAME=${DB_NAME:-gift_ecommerce}
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis-cache:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT_MS=1500
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET for local Compose}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-GIFTLY_DEV_TMN}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-giftly_dev_vnpay_hash_secret_key_2026}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL:-http://localhost:5000/api/payments/mock-vnpay}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:5000/api/payments/vnpay/return}
      - MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE:-MOMO}
      - MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY:-F8BBA842ECF85}
      - MOMO_SECRET_KEY=${MOMO_SECRET_KEY:-K951B6PE1waDMi640xX08PD3vg6EkVlz}
      - MOMO_API_URL=${MOMO_API_URL:-https://test-payment.momo.vn/v2/gateway/api/create}
      - MOMO_RETURN_URL=${MOMO_RETURN_URL:-http://localhost:5000/api/payments/momo/return}
      - MOMO_IPN_URL=${MOMO_IPN_URL:-http://localhost:5000/api/payments/momo/ipn}
      - MOMO_USE_MOCK=${MOMO_USE_MOCK:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  core-frontend:
    build:
      context: ./core-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT:-5000}/api
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      core-backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
